name: Build signed Android release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-release-apk.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode and validate PKCS12 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamer-mobile-release.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/gamer-mobile-release.p12" -noout -passin env:KEYSTORE_PASSWORD
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gamer-mobile-release.p12" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-preview
          name: Gamer Mobile v0.3.0-preview
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            > **预览版说明 / Preview notice**：当前版本是配置界面原型，用于验证签名发布流程与界面预览，**尚不是可用的 AI 游戏助手**。

            已包含：应用主界面、AI 服务提供方配置入口、屏幕捕获授权引导、无障碍服务设置引导。

            尚未实现（当前版本不包含）：真实模型推理、网络请求、自动游戏操作、长期记忆与学习。

            安装：下载下方 `app-release.apk`，在安卓手机上允许"安装未知来源应用"后安装。需要 Android 8.0（API 26）及以上。

            签名：使用项目自签名证书，有效期至 2056 年；后续正式版本请使用同一密钥，以保证可覆盖升级。
          files: android/app/build/outputs/apk/release/app-release.apk
