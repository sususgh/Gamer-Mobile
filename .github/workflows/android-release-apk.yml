name: Build signed Android release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-release-apk.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode and validate PKCS12 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamer-mobile-release.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/gamer-mobile-release.p12" -noout -passin env:KEYSTORE_PASSWORD
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gamer-mobile-release.p12" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app version
        id: app-version
        working-directory: android
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\\([^"]*\\)"/\\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Gamer Mobile ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            > **预览版说明 / Preview notice**：本版本继续作为 Android 集成预览版发布，**尚不是完整可用的 AI 游戏助手**。

            已包含：应用主界面、AI 服务提供方配置入口、屏幕捕获授权引导、无障碍服务设置引导，以及派蒙语音模型上游下载入口（打开社区项目页面）。

            尚未实现：Android 本地派蒙 VITS 推理、派蒙宠物动态、真实模型推理、远程 AI 请求和自动游戏操作。模型权重需用户按上游说明另行获取；当前 APK 不包含 paimon.pth，也不代表模型已安装。

            安装：下载下方 `app-release.apk`，在安卓手机上允许"安装未知来源应用"后安装。需要 Android 8.0（API 26）及以上。

            签名：使用项目自签名证书；升级安装需沿用同一签名密钥。派蒙语音模型上游：https://github.com/gaaiyun/ai-paimon （请遵守上游个人、非商业使用限制）。
          files: android/app/build/outputs/apk/release/app-release.apk
